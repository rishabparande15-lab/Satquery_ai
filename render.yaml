services:
  - type: web
    name: satquery-backend-xgja
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: API_HOST
        value: "0.0.0.0"
      - key: CORS_ORIGIN_REGEX
        value: "^https://.*\\.netlify\\.app$"
